<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — West Coast Shopping Cart Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:   #080c18;
  --blue:   #1a5fb4;
  --accent: #2563eb;
  --white:  #ffffff;
  --light:  #f4f7fb;
  --border: #dde4ee;
  --gray:   #6b7280;
  --green:  #16a34a;
  --red:    #dc2626;
  --yellow: #d97706;
}
body { font-family: 'Roboto', sans-serif; background: var(--light); color: #111827; min-height: 100vh; }

/* ── Login ── */
#loginScreen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  background: linear-gradient(140deg, #020408 0%, #060f20 40%, #0d2255 75%, #1a4ec4 100%);
}
.login-box {
  background: var(--white); border-radius: 16px;
  padding: 48px 40px; width: 100%; max-width: 400px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.35);
}
.login-logo { text-align: center; margin-bottom: 28px; }
.login-logo img { height: 64px; object-fit: contain; }
.login-title { font-size: 1.25rem; font-weight: 700; color: var(--navy); text-align: center; margin-bottom: 6px; }
.login-sub   { font-size: .875rem; color: var(--gray); text-align: center; margin-bottom: 28px; }
.login-box label { font-size: .8rem; font-weight: 600; color: #374151; display: block; margin-bottom: 6px; }
.login-box input {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: .9rem; font-family: inherit;
  outline: none; transition: border-color .2s;
}
.login-box input:focus { border-color: var(--accent); }
.login-btn {
  width: 100%; margin-top: 16px; padding: 13px;
  background: var(--accent); color: var(--white);
  border: none; border-radius: 8px; font-size: .95rem;
  font-weight: 700; font-family: inherit; cursor: pointer;
  transition: background .2s;
}
.login-btn:hover { background: #1d4ed8; }
.login-error { color: var(--red); font-size: .82rem; margin-top: 10px; text-align: center; display: none; }

/* ── App shell ── */
#appShell { display: block; }

.app-header {
  background: var(--navy); color: var(--white);
  padding: 0 28px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.app-header-left { display: flex; align-items: center; gap: 14px; }
.app-header-left img { height: 36px; object-fit: contain; }
.app-header-title { font-size: 1rem; font-weight: 700; letter-spacing: .02em; }
.app-header-sub   { font-size: .75rem; opacity: .6; }
.logout-btn {
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
  color: var(--white); padding: 7px 16px; border-radius: 6px;
  font-size: .82rem; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: background .2s;
}
.logout-btn:hover { background: rgba(255,255,255,.22); }

.app-body { max-width: 1300px; margin: 0 auto; padding: 28px 24px; }

/* ── Stats ── */
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
.stat-card {
  background: var(--white); border-radius: 12px; padding: 20px 24px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06); border-left: 4px solid transparent;
}
.stat-card--total  { border-color: var(--accent); }
.stat-card--contact{ border-color: var(--green); }
.stat-card--report { border-color: var(--yellow); }
.stat-label { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--gray); margin-bottom: 6px; }
.stat-num   { font-size: 2rem; font-weight: 700; color: var(--navy); }

/* ── Toolbar ── */
.toolbar {
  background: var(--white); border-radius: 12px;
  padding: 16px 20px; margin-bottom: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.filter-tabs { display: flex; gap: 6px; }
.tab-btn {
  padding: 7px 16px; border-radius: 6px; border: 1.5px solid var(--border);
  background: transparent; font-size: .83rem; font-weight: 600;
  cursor: pointer; font-family: inherit; color: var(--gray);
  transition: all .18s;
}
.tab-btn.active { background: var(--accent); border-color: var(--accent); color: var(--white); }
.tab-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

.city-select {
  padding: 7px 12px; border-radius: 6px; border: 1.5px solid var(--border);
  background: var(--white); font-size: .83rem; font-weight: 600;
  font-family: inherit; color: #374151; cursor: pointer; outline: none;
}
.city-select:focus { border-color: var(--accent); }
.btn-city-report { background: #ede9fe; color: #6d28d9; }
.btn-city-report:hover { background: #ddd6fe; }

.toolbar-actions { display: flex; gap: 8px; }
.action-btn {
  padding: 8px 16px; border-radius: 7px; border: none;
  font-size: .83rem; font-weight: 600; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; gap: 6px; transition: background .18s;
}
.btn-export { background: #d1fae5; color: #065f46; }
.btn-export:hover { background: #a7f3d0; }
.btn-delete-sel { background: #fee2e2; color: var(--red); }
.btn-delete-sel:hover { background: #fecaca; }
.btn-delete-all { background: #fee2e2; color: var(--red); }
.btn-delete-all:hover { background: #fecaca; }

/* ── Table ── */
.table-wrap {
  background: var(--white); border-radius: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: hidden;
}
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .84rem; }
thead th {
  background: #f9fafb; padding: 12px 14px;
  text-align: left; font-size: .73rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em; color: var(--gray);
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
tbody tr { border-bottom: 1px solid #f3f4f6; transition: background .12s; }
tbody tr:hover { background: #f9fafb; }
tbody tr:last-child { border-bottom: none; }
td { padding: 12px 14px; vertical-align: top; }
td.td-check { width: 40px; }
input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }

.badge {
  display: inline-block; padding: 3px 9px; border-radius: 50px;
  font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
}
.badge--contact { background: #dcfce7; color: #15803d; }
.badge--report  { background: #fef3c7; color: #92400e; }

.td-msg { max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--gray); }
.td-name { font-weight: 600; white-space: nowrap; }
.td-date { white-space: nowrap; color: var(--gray); font-size: .78rem; }

.del-btn {
  background: none; border: none; color: #f87171; cursor: pointer;
  padding: 4px 8px; border-radius: 4px; font-size: .8rem; font-weight: 600;
  transition: background .15s;
}
.del-btn:hover { background: #fee2e2; }

.empty-state {
  text-align: center; padding: 60px 20px; color: var(--gray);
}
.empty-state svg { opacity: .3; margin-bottom: 12px; }
.empty-state p { font-size: .95rem; }

/* ── Cards ── */
.card {
  background: var(--white); border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  margin-bottom: 10px; overflow: hidden;
  border: 1px solid var(--border);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; cursor: pointer; gap: 12px;
  transition: background .15s;
}
.card-header:hover { background: #f9fafb; }
.card-header-left  { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.card-name  { font-weight: 600; font-size: .9rem; }
.card-city  { font-size: .8rem; color: var(--gray); background: var(--light); padding: 2px 8px; border-radius: 50px; }
.card-date  { font-size: .78rem; color: var(--gray); white-space: nowrap; }
.card-chevron { font-size: .9rem; color: var(--gray); }
.card-body  { padding: 0 18px 18px; border-top: 1px solid var(--border); }
.detail-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 12px; padding-top: 14px;
}
.detail-item { display: flex; flex-direction: column; gap: 3px; }
.detail-item--full { grid-column: 1 / -1; }
.detail-lbl { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--gray); }
.detail-item span:last-child { font-size: .88rem; color: #111827; }

/* Loading */
.loading { text-align: center; padding: 48px; color: var(--gray); }
.spinner {
  width: 32px; height: 32px; margin: 0 auto 12px;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--navy); color: var(--white);
  padding: 12px 20px; border-radius: 8px; font-size: .88rem; font-weight: 500;
  box-shadow: 0 8px 24px rgba(0,0,0,.3); z-index: 9999;
  transform: translateY(80px); opacity: 0; transition: all .3s ease;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.toast--err { background: var(--red); }

@media (max-width: 700px) {
  .stats-row { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card { padding: 14px 16px; }
  .stat-num { font-size: 1.5rem; }
  .app-body { padding: 12px 10px; }
  .app-header { padding: 0 14px; height: 52px; }
  .app-header-title { font-size: .85rem; }
  .app-header-sub { display: none; }
  .app-header-left img { height: 28px; }
  .toolbar { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px 14px; }
  .filter-tabs { flex-wrap: wrap; }
  .tab-btn { font-size: .78rem; padding: 6px 12px; }
  .city-select { width: 100%; }
  .toolbar-actions { flex-wrap: wrap; gap: 6px; }
  .action-btn { font-size: .78rem; padding: 7px 12px; flex: 1 1 auto; justify-content: center; }
  .detail-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .detail-item--full { grid-column: 1 / -1; }
  .card-header { padding: 12px 14px; }
  .card-body { padding: 0 14px 14px; }
  .card-name { font-size: .85rem; }
  .logout-btn { padding: 6px 10px; font-size: .78rem; }
}
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="loginScreen" style="display:none">
  <div class="login-box">
    <div class="login-logo">
      <img src="wcshopping cart logo.webp" alt="West Coast Shopping Cart Service">
    </div>
    <div class="login-title">Admin Dashboard</div>
    <div class="login-sub">Enter your admin key to continue</div>
    <label for="adminKey">Admin Key</label>
    <input type="password" id="adminKey" placeholder="••••••••••••" autocomplete="current-password">
    <button class="login-btn" onclick="login()">Sign In</button>
    <div class="login-error" id="loginError">Incorrect key — please try again.</div>
  </div>
</div>

<!-- ── App ── -->
<div id="appShell">
  <header class="app-header">
    <div class="app-header-left">
      <a href="/" style="display:flex;align-items:center;text-decoration:none;">
        <img src="wcshopping cart logo.webp" alt="WCSC">
      </a>
      <div>
        <div class="app-header-title">West Coast Shopping Cart Service</div>
        <div class="app-header-sub">Form Submissions Dashboard</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </header>

  <div class="app-body">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card stat-card--total">
        <div class="stat-label">Total Submissions</div>
        <div class="stat-num" id="statTotal">—</div>
      </div>
      <div class="stat-card stat-card--contact">
        <div class="stat-label">Contact Leads</div>
        <div class="stat-num" id="statContact">—</div>
      </div>
      <div class="stat-card stat-card--report">
        <div class="stat-label">Cart Reports</div>
        <div class="stat-num" id="statReport">—</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setFilter('all', this)">All</button>
        <button class="tab-btn" onclick="setFilter('contact', this)">Contact Leads</button>
        <button class="tab-btn" onclick="setFilter('report', this)">Cart Reports</button>
      </div>
      <select class="city-select" id="citySelect" onchange="setCityFilter(this.value)">
        <option value="all">All Cities</option>
      </select>
      <div class="toolbar-actions">
        <button class="action-btn btn-city-report" onclick="exportCityReport()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          City Report
        </button>
        <button class="action-btn btn-export" onclick="exportCSV()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </button>
        <button class="action-btn btn-delete-sel" onclick="deleteSelected()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          Delete Selected
        </button>
        <button class="action-btn btn-delete-all" onclick="deleteAll()">
          Clear All
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <div id="tableContent">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading submissions…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://wcsc-api.aarana.workers.dev/submissions';
let allData      = [];
let filtered     = [];
let activeFilter = 'all';
let activeCity   = 'all';

/* ── Load on page open ── */
async function loadData() {
  const res = await fetch(API);
  allData = await res.json();
  render();
}

loadData();

/* ── Filter ── */
function setFilter(type, btn) {
  activeFilter = type;
  activeCity   = 'all';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setCityFilter(city) {
  activeCity = city;
  render();
}

/* ── Render ── */
function render() {
  const typeFiltered = activeFilter === 'all' ? allData : allData.filter(r => r.type === activeFilter);

  // Rebuild city dropdown from type-filtered data
  const cities = [...new Set(typeFiltered.map(r => r.city || '').filter(Boolean))].sort();
  const sel = document.getElementById('citySelect');
  const prev = sel.value;
  sel.innerHTML = '<option value="all">All Cities</option>' +
    cities.map(c => `<option value="${esc(c)}"${activeCity === c ? ' selected' : ''}>${esc(c)}</option>`).join('');
  if (cities.includes(activeCity)) sel.value = activeCity; else { activeCity = 'all'; sel.value = 'all'; }

  filtered = activeCity === 'all' ? typeFiltered : typeFiltered.filter(r => (r.city||'') === activeCity);
  updateStats();

  const wrap = document.getElementById('tableContent');
  if (!filtered.length) {
    wrap.innerHTML = `<div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
      <p>No submissions yet.</p>
    </div>`;
    return;
  }

  const isContact = activeFilter === 'contact';
  const isReport  = activeFilter === 'report';
  const showAll   = activeFilter === 'all';

  const rows = filtered.map((r) => {
    const date = new Date(r.timestamp).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
    const name = r.type === 'contact' ? `${r.first_name||''} ${r.last_name||''}`.trim() : (r.name||'');
    const city = r.city || '';
    const isC  = r.type === 'contact';

    const detail = isC ? `
      <div class="detail-grid">
        <div class="detail-item"><span class="detail-lbl">Email</span><span>${esc(r.email||'—')}</span></div>
        <div class="detail-item"><span class="detail-lbl">Phone</span><span>${esc(r.phone||'—')}</span></div>
        <div class="detail-item"><span class="detail-lbl">City</span><span>${esc(city||'—')}</span></div>
        <div class="detail-item"><span class="detail-lbl">Business</span><span>${esc(r.business_name||'—')}</span></div>
        <div class="detail-item"><span class="detail-lbl">Service</span><span>${esc(r.service||'—')}</span></div>
        <div class="detail-item detail-item--full"><span class="detail-lbl">Message</span><span>${esc(r.message||'—')}</span></div>
      </div>` : `
      <div class="detail-grid">
        <div class="detail-item"><span class="detail-lbl">Contact</span><span>${esc(r.contact||'—')}</span></div>
        <div class="detail-item"><span class="detail-lbl">City</span><span>${esc(city||'—')}</span></div>
        <div class="detail-item"><span class="detail-lbl">Store</span><span>${esc(r.store_name||'—')}</span></div>
        <div class="detail-item"><span class="detail-lbl">Location</span><span>${esc(r.location||'—')}</span></div>
        <div class="detail-item"><span class="detail-lbl"># Carts</span><span>${esc(r.cart_count||'—')}</span></div>
        <div class="detail-item detail-item--full"><span class="detail-lbl">Notes</span><span>${esc(r.notes||'—')}</span></div>
      </div>`;

    return `<div class="card" id="card-${r.id}">
      <div class="card-header" onclick="toggleCard(${r.id})">
        <div class="card-header-left">
          <input type="checkbox" class="row-check" data-key="${r.id}" onclick="event.stopPropagation()">
          <span class="badge badge--${r.type}">${isC ? 'Lead' : 'Report'}</span>
          <span class="card-name">${esc(name)}</span>
          ${city ? `<span class="card-city">${esc(city)}</span>` : ''}
        </div>
        <div class="card-header-right">
          <span class="card-date">${date}</span>
          <button class="del-btn" onclick="event.stopPropagation();deleteOne(${r.id})">Delete</button>
          <span class="card-chevron" id="chev-${r.id}">▸</span>
        </div>
      </div>
      <div class="card-body" id="body-${r.id}" style="display:none">
        ${detail}
      </div>
    </div>`;
  }).join('');

  wrap.innerHTML = rows || `<div class="empty-state">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
    <p>No submissions yet.</p>
  </div>`;
}

function updateStats() {
  document.getElementById('statTotal').textContent   = allData.length;
  document.getElementById('statContact').textContent = allData.filter(r => r.type === 'contact').length;
  document.getElementById('statReport').textContent  = allData.filter(r => r.type === 'report').length;
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Card expand ── */
function toggleCard(id) {
  const body = document.getElementById(`body-${id}`);
  const chev = document.getElementById(`chev-${id}`);
  const open = body.style.display === 'none';
  body.style.display = open ? 'block' : 'none';
  chev.textContent = open ? '▾' : '▸';
}

/* ── Select all ── */
function toggleAll(cb) {
  document.querySelectorAll('.row-check').forEach(c => c.checked = cb.checked);
}

/* ── Delete ── */
async function deleteOne(key) {
  if (!confirm('Delete this submission?')) return;
  await apiFetch(`${API}?id=${encodeURIComponent(key)}`, 'DELETE');
  allData = allData.filter(r => r.id !== key);
  render();
  toast('Submission deleted.');
}

async function deleteSelected() {
  const keys = [...document.querySelectorAll('.row-check:checked')].map(c => c.dataset.key);
  if (!keys.length) { toast('No rows selected.', true); return; }
  if (!confirm(`Delete ${keys.length} submission(s)?`)) return;
  await Promise.all(keys.map(k => apiFetch(`${API}?id=${encodeURIComponent(k)}`, 'DELETE')));
  allData = allData.filter(r => !keys.includes(String(r.id)));
  render();
  toast(`${keys.length} submission(s) deleted.`);
}

async function deleteAll() {
  if (!allData.length) { toast('Nothing to delete.', true); return; }
  if (!confirm(`Delete ALL ${allData.length} submissions? This cannot be undone.`)) return;
  await apiFetch(`${API}?id=__all__`, 'DELETE');
  allData = [];
  render();
  toast('All submissions cleared.');
}

function apiFetch(url, method) {
  return fetch(url, { method });
}

/* ── CSV Export ── */
function exportCSV() {
  if (!filtered.length) { toast('No data to export.', true); return; }

  const contactCols = ['id','timestamp','type','city','first_name','last_name','email','phone','business_name','service','message'];
  const reportCols  = ['id','timestamp','type','city','name','contact','store_name','location','cart_count','notes'];
  const allCols     = [...new Set([...contactCols, ...reportCols])];

  const sorted = [...filtered].sort((a, b) => (a.city || '').localeCompare(b.city || ''));
  const header = allCols.join(',');
  const rows = sorted.map(r =>
    allCols.map(col => {
      const val = r[col] != null ? String(r[col]) : '';
      return `"${val.replace(/"/g, '""')}"`;
    }).join(',')
  );

  const csv = [header, ...rows].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `wcsc-submissions-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast(`Exported ${filtered.length} row(s).`);
}

/* ── City Report ── */
function exportCityReport() {
  const reports = allData.filter(r => r.type === 'report');
  if (!reports.length) { toast('No cart reports to summarize.', true); return; }

  const cityMap = {};
  reports.forEach(r => {
    const city = r.city || '(No City)';
    if (!cityMap[city]) cityMap[city] = [];
    cityMap[city].push(r);
  });

  const header = 'City,Total Reports,Stores,Locations,Total Carts,Latest Report';
  const rows = Object.entries(cityMap)
    .sort(([a],[b]) => a.localeCompare(b))
    .map(([city, items]) => {
      const stores    = [...new Set(items.map(r => r.store_name).filter(Boolean))].join('; ');
      const locations = [...new Set(items.map(r => r.location).filter(Boolean))].join('; ');
      const totalCarts = items.reduce((sum, r) => sum + (parseInt(r.cart_count)||0), 0);
      const latest    = items.map(r => r.timestamp).sort().reverse()[0];
      const latestFmt = new Date(latest).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      const q = v => `"${String(v).replace(/"/g,'""')}"`;
      return [q(city), items.length, q(stores), q(locations), totalCarts, q(latestFmt)].join(',');
    });

  const csv = [header, ...rows].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `wcsc-city-report-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast(`City report exported — ${Object.keys(cityMap).length} cities.`);
}

/* ── Sign Out ── */
function logout() {
  window.location.href = '/cdn-cgi/access/logout';
}

/* ── Toast ── */
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' toast--err' : '');
  setTimeout(() => el.className = 'toast', 3000);
}
